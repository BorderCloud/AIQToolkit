[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = "../../.."

[project]
name = "wikidata_ontologist"
dynamic = ["version"]
dependencies = [
  "aiqtoolkit[langchain]~=1.2",
  "sparqlwrapper>=2.0.0"
]
requires-python = ">=3.12"
description = "Example of ontologist agent with Wikidata"
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
aiqtoolkit = { path = "../../..", editable = true }

[project.entry-points.'aiq.components']
wikidata_ontologist = "wikidata_ontologist.register"
